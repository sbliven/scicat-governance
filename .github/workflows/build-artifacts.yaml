name: Build Documentation PDF

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex

      - name: Set version suffix
        id: suffix
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "suffix=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "suffix=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate combined document
        run: |
          cd utils
          bash create_single_document.bash "${{ steps.suffix.outputs.suffix }}"

      - name: Upload Markdown artifact
        uses: actions/upload-artifact@v4
        with:
          name: scicat-governance-md
          path: utils/scicat_governance_full_*.md

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: scicat-governance-pdf
          path: utils/scicat_governance_full_*.pdf
